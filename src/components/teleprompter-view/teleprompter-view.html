<button type="button" id="open">Open Teleprompter</button>
<section id="teleprompter" hidden>
  <div id="viewport">
    <div id="speech"></div>
  </div>

  <p class="countdown" hidden>Get ready…</p>

  <div class="controls">
    <button type="button" data-event="start">Start</button>
    <button type="button" data-event="pause">Pause</button>
    <button type="button" data-event="resume">Resume</button>
    <button type="button" data-event="restart">Restart</button>
    <button type="button" data-event="exit">Exit</button>
  </div>
</section>
